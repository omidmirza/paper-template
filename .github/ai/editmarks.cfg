% .github/ai/editmarks.cfg - the editor `ai', for edits made by an AI assistant.
% editmarks.sty reads this file at the end of the package (TeX finds it through latexmkrc), so
% setup.tex does not need a line for it. The editor is declared at the end of the preamble and only
% if the paper has no editor `ai' of its own; it shows in the legend only when it has marks.
\definecolor{AIviolet}{HTML}{8000F0}
\AtEndPreamble{%
  \ifcsdef{em@ini@ai}{}{\DeclareEditor[AIviolet]{ai}{AI}\editorname{ai}{AI assistant}}}
\endinput
